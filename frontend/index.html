<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TNP Email Agent: placement notices, deadlines and alerts from your Gmail." />
    <title>TNP Agent</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
